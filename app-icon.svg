<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="50" y="50" width="412" height="412" rx="80" fill="url(#grad1)"/>

  <!-- Click counter display -->
  <rect x="120" y="120" width="272" height="272" rx="40" fill="white" opacity="0.95"/>

  <!-- Number "0" in the center -->
  <text x="256" y="310" font-family="Arial, sans-serif" font-size="180" font-weight="bold" fill="#6366f1" text-anchor="middle">0</text>

  <!-- Small click indicator circles -->
  <circle cx="380" cy="150" r="20" fill="white" opacity="0.7"/>
  <circle cx="380" cy="150" r="12" fill="#6366f1"/>

  <circle cx="140" cy="370" r="18" fill="white" opacity="0.6"/>
  <circle cx="140" cy="370" r="10" fill="#8b5cf6"/>

  <circle cx="370" cy="360" r="16" fill="white" opacity="0.5"/>
  <circle cx="370" cy="360" r="9" fill="#6366f1"/>
</svg>
